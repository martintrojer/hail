[package]
name = "hail-jmap"
description = "Thin wrapper over jmap-client with hail conventions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
jmap-client = { version = "0.4", features = ["async", "websockets"] }
secrecy = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
