[package]
name = "hail-test"
description = "Reusable test fixtures and helpers for hail integration and smoke tests."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hail-api = { path = "../hail-api" }
hail-core = { path = "../hail-core" }
hail-db = { path = "../hail-db" }
hail-jmap = { path = "../hail-jmap" }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
tempfile = "3"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
