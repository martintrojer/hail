[package]
name = "hail-api"
description = "Axum HTTP server: REST + WebSocket + SPA serving."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# When enabled, serves a Redoc HTML UI at /api/docs. Off by default so
# production builds don't ship the Redoc bundle. See main.rs for the
# rationale (size + minimal attack surface). The OpenAPI JSON spec at
# /api/openapi.json is always served regardless of this flag.
default = []
dev-docs = ["dep:utoipa-redoc"]
# Mount the `routes::test_stub` module (one 204-on-reach POST endpoint
# behind the auth middleware). Used by `tests/auth.rs` to verify the
# CSRF gate without coupling the test to a real downstream verb. The
# production binary never enables this feature, and `main.rs` passes
# `include_test_stubs=false` regardless.
__test-stubs = []

[dependencies]
hail-core = { path = "../hail-core" }
hail-db = { path = "../hail-db" }
hail-backend = { path = "../hail-backend" }
hail-jmap = { path = "../hail-jmap" }
hail-worker = { path = "../hail-worker" }
hail-cache = { path = "../hail-cache" }
hail-blob-store = { path = "../hail-blob-store" }
hail-gmail = { path = "../hail-gmail" }

# Runtime + HTTP plumbing. Versions mirror hail-worker so the workspace
# stays on a single set of tokio/axum/tower-http versions.
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }

# Observability + serde.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OpenAPI generation. `utoipa-axum` lets us use `OpenApiRouter` so each
# `#[utoipa::path]` handler auto-registers its spec when mounted.
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-redoc = { version = "6", features = ["axum"], optional = true }

# Errors.
anyhow = "1"
thiserror = "2"

# Re-exported here only so `AppState` can hold a `SqlitePool` directly.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }

# Auth + cookies + crypto plumbing.
secrecy = "0.10"
rand = "0.9"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
subtle = "2"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
pulldown-cmark = "0.13"
sha2 = "0.10"
url = "2"
mail-parser = "0.11"
bytes = { version = "1", features = ["serde"] }
futures-util = "0.3"
futures-core = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
futures-core = "0.3"
# Pull ourselves back in with the test-stub feature on. This is the
# standard pattern for unblocking integration tests that need a
# behind-the-firewall debug endpoint.
hail-api = { path = ".", features = ["__test-stubs"] }
hail-test = { path = "../hail-test" }
tempfile = "3"
