[package]
name = "hail-worker"
description = "Tokio worker: JMAP push consumer and scheduler."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hail-core = { path = "../hail-core" }
hail-db = { path = "../hail-db" }
hail-gmail = { path = "../hail-gmail" }
hail-cache = { path = "../hail-cache" }
hail-blob-store = { path = "../hail-blob-store" }
hail-backend = { path = "../hail-backend" }
# hail-jmap is currently an empty crate; wired in now so future tasks (jmap-eventsource)
# don't need to touch Cargo.toml. Verified to compile via `cargo check -p hail-jmap`.
hail-jmap = { path = "../hail-jmap" }
mail-parser = "0.11"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono"] }
futures-util = "0.3"
futures-core = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.10"
secrecy = "0.10"
async-trait = "0.1"
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json"] }
base64 = "0.22"
url = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "pool"] }

[dev-dependencies]
hail-test = { path = "../hail-test" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tempfile = "3"
