[server]
hostname = "mail.localhost"

[server.listener."http"]
bind = ["0.0.0.0:8080"]
protocol = "http"

[server.listener."smtp"]
bind = ["0.0.0.0:25"]
protocol = "smtp"

[server.listener."submission"]
bind = ["0.0.0.0:587"]
protocol = "smtp"

[server.listener."imap"]
bind = ["0.0.0.0:143"]
protocol = "imap"

[storage]
data = "sqlite"
fts = "sqlite"
lookup = "sqlite"
blob = "filesystem"
directory = "internal"

[store."sqlite"]
type = "sqlite"
path = "/opt/stalwart/data/index.sqlite3"

[store."filesystem"]
type = "fs"
path = "/opt/stalwart/data/blobs"
depth = 2

# Local smoke profile: provider import uses JMAP Blob/upload before
# Email/import, so Stalwart's default 1000 files / 50 MB upload-window quota can
# stop live Gmail smoke runs after only a few hundred messages. This raises the
# per-window JMAP upload quota for throwaway local containers only. Keep
# production quotas deliberate; see docs/provider-import-architecture.md.
[jmap.protocol.upload]
max-size = 50000000
max-concurrent = 4
ttl = "1h"

[jmap.protocol.upload.quota]
files = 10000
size = 1073741824

[directory."internal"]
type = "internal"
store = "sqlite"

[authentication.fallback-admin]
user = "admin"
secret = "changeme123"

# Optional provider-import smarthost snippets live in:
# - deploy/stalwart-provider-gmail-smarthost.example.toml
# - deploy/stalwart-provider-generic-smarthost.example.toml
# Keep this local smoke config relay-free unless a test explicitly mounts a
# private smarthost config and injects provider SMTP secrets via environment.

[tracer."stdout"]
type = "stdout"
level = "info"
ansi = false
enable = true
