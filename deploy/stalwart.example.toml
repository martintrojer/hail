#############################################
# hail + Stalwart example configuration
#############################################
# Target: Stalwart v0.13+ legacy TOML/bootstrap layout, usable with the
# `stalwartlabs/stalwart` container when mounted as /opt/stalwart/etc/config.toml.
#
# Current Stalwart releases are increasingly managed through a small startup
# config plus WebUI/JMAP configuration objects. This file intentionally sets
# only the small set of keys hail needs for first boot; everything else relies
# on Stalwart's compiled-in safe defaults.
#
# OPERATOR-REQUIRED EDITS BEFORE FIRST BOOT
# =========================================
# 1. DOMAIN / HOSTNAME:
#    Replace `mail.example.com` everywhere in this file with your real mail
#    hostname, for example the host used by your MX record and reverse proxy.
#
# 2. ADMIN PASSWORD:
#    Replace the placeholder in [authentication.fallback-admin].secret with a
#    real password hash. Generate one inside the container or host install with:
#
#        stalwart pwhash
#
#    If your image exposes the binary under a different name, use that binary's
#    pwhash subcommand, or allow first-boot/bootstrap to print a temporary admin
#    token/password and then rotate it immediately in the WebUI.
#
#    Never put a plaintext password in this file.

#############################################
# Server identity
#############################################
# Confirmed key: https://stalw.art/docs/server/general/
# Stalwart uses this hostname in SMTP EHLO, message headers, reports, and DNS
# records generated by the admin UI. It MUST be your public mail hostname.
[server]
hostname = "mail.example.com"

#############################################
# Network listeners
#############################################
# Hail talks ONLY JMAP to Stalwart. Stalwart serves JMAP under /jmap on every
# HTTP listener. This profile exposes a plain HTTP listener on port 8080 because
# TLS is expected to terminate at Caddy, NGINX, Traefik, or Cloudflare Tunnel.
#
# Reverse-proxy route for hail:
#   https://mail.example.com/jmap  ->  http://stalwart:8080/jmap
#
# The same HTTP listener also hosts Stalwart's admin/account endpoints.
[server.listener."http"]
bind = ["0.0.0.0:8080"]
protocol = "http"

# IMAP remains enabled so users may also use Thunderbird, Apple Mail, mutt, etc.
# Hail does not use IMAP, but design.md §3 requires an unmodified upstream
# Stalwart that does not block other clients.
[server.listener."imap"]
bind = ["0.0.0.0:143"]
protocol = "imap"

[server.listener."imaptls"]
bind = ["0.0.0.0:993"]
protocol = "imap"
tls.implicit = true

# SMTP inbound from the public internet. Your MX record should point at the
# host named by server.hostname, and port 25 must be reachable unless you use
# the Cloudflare Email Routing recipe noted in TROUBLESHOOTING below.
[server.listener."smtp"]
bind = ["0.0.0.0:25"]
protocol = "smtp"

# SMTP submission for authenticated users and desktop/mobile mail clients.
# Port 587 normally uses STARTTLS; port 465 uses implicit TLS.
[server.listener."submission"]
bind = ["0.0.0.0:587"]
protocol = "smtp"

[server.listener."submissions"]
bind = ["0.0.0.0:465"]
protocol = "smtp"
tls.implicit = true

# Sieve is enabled for future user-authored filters and the v2 hail Sieve
# editor roadmap. ManageSieve clients use port 4190. Stalwart also supports
# JMAP for Sieve Scripts; no hail runtime dependency is assumed here.
[server.listener."sieve"]
bind = ["0.0.0.0:4190"]
protocol = "managesieve"

# Deliberately no POP3 listeners in this example. Add them in the Stalwart WebUI
# if you have a legacy client that truly needs POP3.

#############################################
# Storage profile: SQLite metadata + filesystem blobs
#############################################
# Confirmed keys:
#   SQLite:    https://stalw.art/docs/storage/backends/sqlite/
#   Filesystem blob store: https://stalw.art/docs/storage/backends/filesystem/
#   Blob selector: https://stalw.art/docs/storage/blob/
#
# Data / FTS / in-memory lookup state use one local SQLite database. Raw message
# bodies, attachments, and Sieve scripts use a filesystem blob store at the path
# requested by hail's deployment profile.
[storage]
data = "sqlite"
fts = "sqlite"
lookup = "sqlite"
blob = "filesystem"
directory = "internal"

[store."sqlite"]
type = "sqlite"
path = "/var/lib/stalwart/stalwart.sqlite3"

[store."sqlite".pool]
max-connections = 10
workers = 10

[store."filesystem"]
type = "fs"
path = "/var/lib/stalwart/blobs"
depth = 2

#############################################
# JMAP upload quotas
#############################################
# Provider import uploads each raw RFC822 message to Stalwart with JMAP
# Blob/upload, then creates the local message with Email/import. Stalwart's
# default upload-window quota is intentionally conservative (1000 files /
# 50,000,000 bytes per account per window) and can stop large historical Gmail
# imports before the mailbox is fully backfilled.
#
# Leave production limits explicit and sized for your host. For development or
# one-time historical import smoke, either set hail's bounded Gmail import knob:
#   HAIL_PROVIDER_IMPORT__GMAIL__INITIAL_IMPORT_MAX_MESSAGES=200
# or raise the Stalwart upload quota below and restart Stalwart before running a
# larger backfill. See docs/provider-import-architecture.md for the runbook.
#
# [jmap.protocol.upload]
# max-size = 50000000
# max-concurrent = 4
# ttl = "1h"
#
# [jmap.protocol.upload.quota]
# files = 10000
# size = 1073741824

#############################################
# Authentication backend: Stalwart internal directory
#############################################
# Confirmed keys from Stalwart's distributed config.toml:
#   storage.directory = "internal"
#   [directory."internal"] type = "internal"; store = <store id>
#
# Use Stalwart's WebUI, CLI, or hail's admin/setup pages to create domains and
# user accounts in this internal directory. For hail, those accounts are the
# source of truth for mail credentials; hail-api will proxy user login to
# Stalwart/JMAP and store only an encrypted JMAP token in hail.db sessions.
#
# Hail provisioning path:
# - /setup with `stalwart.management_url` configured authenticates to Stalwart
#   v0.16's REST API, creates the domain and mailbox with bearer-authorized
#   `POST /api/principal` calls, then verifies the new mailbox via JMAP. If
#   management_url is unset, /setup only verifies a pre-created account with
#   JMAP.
# - /admin Domains calls the same domain endpoint for create/delete.
# - /admin Create user ensures the user's email domain exists before creating
#   the principal, so one shared domain can host many mailboxes without editing
#   this file or restarting Stalwart.
#
# Provider-import outbound smarthosts:
# - Normal non-provider deployments should leave outbound routing at Stalwart's
#   defaults or manage it in the WebUI; this base file does not force a relay.
# - Provider import mode may relay outbound mail through the mailbox provider so
#   the provider's reputation/DKIM/SPF path is used. See:
#     docs/provider-outbound-strategy.md
#     deploy/stalwart-provider-gmail-smarthost.example.toml
#     deploy/stalwart-provider-generic-smarthost.example.toml
# - Those snippets keep local-domain delivery local and relay only external
#   recipients. They read SMTP credentials from environment placeholders such as
#   HAIL_PROVIDER_SMTP_SECRET; do not commit real provider secrets.
[directory."internal"]
type = "internal"
store = "sqlite"

# Emergency/bootstrap administrator. This is not a normal user mailbox.
# Create real admin users later in Stalwart's internal directory and grant the
# appropriate admin role/permissions from the WebUI.
[authentication.fallback-admin]
user = "admin"
secret = "CHANGE_ME_WITH_OUTPUT_OF_STALWART_PWHASH"

# SAMPLE: additional/admin authentication notes
# ============================================
# Current confirmed Stalwart config exposes [authentication.fallback-admin] for
# emergency/bootstrap administration. Stalwart v0.13+ admin accounts should be
# ordinary internal-directory accounts with admin roles/permissions, created in
# the WebUI or with stalwart-cli after first boot.
#
# The task requested a sample [authentication.fallback] section. I could not
# confirm a Stalwart v0.13+ TOML table named exactly [authentication.fallback]
# in upstream docs, so it is intentionally left commented out.
# TODO verify against upstream docs before uncommenting anything like this.
#
# [authentication.fallback]
# # TODO verify against upstream docs: exact table name and fields for any
# # non-admin fallback-auth chain. Prefer internal-directory users unless the
# # Stalwart docs for your pinned version say otherwise.
# # directory = "internal"
# # mechanism = "password"
#
# User credential mapping for hail-api auth-login:
#   Browser login email/password  ->  hail-api POSTs to Stalwart JMAP/OAuth
#   Stalwart account email        == hail.users.email            (1:1)
#   Stalwart account password     == user's mail/JMAP password
#   hail.users.jmap_account_id    is populated by hail after the first
#                                  JMAP Session fetch; do NOT pre-populate it.

#############################################
# Spam filter and Sieve notes
#############################################
# Stalwart's built-in spam/phishing filter is enabled by default in current
# releases (SpamSettings.enable). On first startup Stalwart downloads the
# default spam-filter rules if outbound HTTPS to GitHub is allowed.
#
# No explicit spam-filter TOML key is set here because the current docs describe
# this as a WebUI/JMAP SpamSettings singleton and say the default is enabled.
# If you have disabled it previously, re-enable it in:
#   WebUI -> Settings -> Spam Filter -> General -> Enable
#
# Sieve is enabled above by exposing the ManageSieve listener. User scripts are
# stored by Stalwart; hail may later add a Sieve editor, but no runtime mutation
# is required in this bootstrap file.

#############################################
# Hail-specific bootstrap notes (no Stalwart config required)
#############################################
# Screener mailbox:
#   Hail expects each user's Stalwart account to have a mailbox named
#   `Screener`. Hail will create it via JMAP on first connect if it is missing.
#   Do not create a Stalwart-side global folder rule for this.
#
# Hail JMAP keyword vocabulary:
#   These are pure JMAP keywords written with Email/set. They require no
#   Stalwart configuration, no IMAP flag registration, and no Sieve script.
#
#   $hail_imbox          Classified to Imbox; mutually exclusive with
#                        $hail_feed and $hail_papertrail.
#   $hail_feed           Classified to Feed; mutually exclusive with
#                        $hail_imbox and $hail_papertrail.
#   $hail_papertrail     Classified to Paper Trail; mutually exclusive with
#                        $hail_imbox and $hail_feed.
#   $hail_screened       Sender decision has been made.
#   $hail_setaside       Thread is on the Set Aside pile.
#   $hail_replylater     Thread is on the Reply Later pile.
#   $hail_seen_together  Thread read as one document; replaces per-message
#                        $seen semantics in hail's UI.

#############################################
# Logging
#############################################
# Container-friendly stdout logging. Stalwart's Docker docs recommend reading
# logs through the container runtime; this keeps logs out of the data volume.
[tracer."stdout"]
type = "stdout"
level = "info"
ansi = false
enable = true

#############################################
# TROUBLESHOOTING
#############################################
# Port 25 blocked / CGNAT / residential ISP:
#   Direct inbound SMTP will not work if the internet cannot reach TCP/25 on
#   this host. Use the Cloudflare Email Routing + Tunnel recipe instead:
#     docs/cloudflare-tunnel.md
#
# DKIM not configured:
#   Receiving mail may work, but outbound deliverability will suffer. After
#   creating your domain in Stalwart, generate DKIM keys and publish the DNS
#   TXT records shown by Stalwart. CLI shortcut:
#     stalwart dkim
#   If your pinned Stalwart CLI uses a different subcommand, use the WebUI path:
#     Management -> Directory/Domains -> your domain -> DKIM -> Generate
#
# Certificates expire / browser or mail-client TLS warnings:
#   This hail profile expects HTTPS/JMAP TLS to be handled by your reverse proxy
#   or Cloudflare Tunnel. Renew certificates in Caddy/NGINX/Traefik/Cloudflare,
#   not in hail. If you expose IMAPS/SMTPS directly, configure Stalwart TLS/ACME
#   or mount valid certificates for those listeners.
#
# JMAP health check:
#   Behind your proxy, /.well-known/jmap and /jmap should reach Stalwart's HTTP
#   listener. An unauthenticated request returning 401 is evidence that the JMAP
#   endpoint is alive.
