#############################################
# OPTIONAL provider-import smarthost example: Gmail SMTP
#############################################
# Copy this file to your private Stalwart config only when this deployment runs
# provider import mode and should relay outbound mail through Gmail. The default
# deploy/stalwart.example.toml intentionally does not include this routing, so
# normal direct-delivery deployments remain unchanged.
#
# Requires Stalwart v0.16+ MTA outbound route objects. In the WebUI the same
# knobs live under Settings -> MTA -> Outbound -> Routes / Strategies.
# Upstream routing docs: https://stalw.art/docs/mta/outbound/routing/
#
# Secret handling:
# - Do not replace the env placeholders with real credentials in git.
# - Pass HAIL_PROVIDER_SMTP_USERNAME and HAIL_PROVIDER_SMTP_SECRET via a local
#   deploy/.env file, Compose secret injection, or your operator secret manager.
# - Redact the username if it is a private address; always redact the secret.
# - For Gmail, use an app password or Workspace-approved SMTP relay credential;
#   do not use your normal Google account password.
#
# Gmail submission uses STARTTLS on 587, so implicitTls/implicit is false.

[queue.strategy]
# Keep local-domain delivery inside Stalwart. Relay only external recipients.
# This prevents local hail/Stalwart mail from looping through Gmail.
route = [
  { if = "is_local_domain('', rcpt_domain)", then = "'local'" },
  { else = "'provider-gmail-smtp'" },
]

[queue.route."local"]
type = "local"

[queue.route."provider-gmail-smtp"]
type = "relay"
address = "smtp.gmail.com"
port = 587
protocol = "smtp"

[queue.route."provider-gmail-smtp".tls]
implicit = false
allow-invalid-certs = false

[queue.route."provider-gmail-smtp".auth]
username = "%{env:HAIL_PROVIDER_SMTP_USERNAME}%"
secret = "%{env:HAIL_PROVIDER_SMTP_SECRET}%"
