# Local rootless Podman compose stack for development smoke tests.
#
# This uses Stalwart's bootstrap WebUI mode intentionally and maps Stalwart mail
# ports to high host ports so rootless Podman can start without lowering
# net.ipv4.ip_unprivileged_port_start.
#
# Use for local stack/setup smoke:
#
#   podman compose -f deploy/docker-compose.local.yml up -d --build
#
# Production/direct SMTP still needs the canonical low-port mapping in
# deploy/docker-compose.yml or a reverse/proxy/mail-routing setup.
#
# Optional hail.db + blob backups: add docker-compose.litestream.yml and back
# up hail-blobs alongside hail-data; see docs/backup.md.

services:
  stalwart:
    image: docker.io/stalwartlabs/stalwart:v0.16
    command: ["--config", "/opt/stalwart/etc/config.json"]
    environment:
      - STALWART_PUBLIC_URL=http://stalwart:8080/
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN:-admin:admin1234}
    ports:
      - "127.0.0.1:18080:8080" # Stalwart WebUI/JMAP
      - "2525:25"              # SMTP (local high port)
      - "2465:465"             # submission SSL
      - "2587:587"             # submission STARTTLS
      - "2143:143"             # IMAP STARTTLS
      - "2993:993"             # IMAP SSL
    volumes:
      - stalwart-data:/opt/stalwart
      - ./stalwart-local.json:/opt/stalwart/etc/config.json:ro,Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz/live >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  stalwart-init:
    build:
      context: ./stalwart-init
    image: hail-stalwart-init:local
    depends_on:
      stalwart:
        condition: service_healthy
    environment:
      - STALWART_URL=http://stalwart:8080
      - STALWART_RECOVERY_ADMIN=${STALWART_RECOVERY_ADMIN:-admin:admin1234}
      - HAIL_LOCAL_SINK=1
    restart: "no"

  hail-api:
    build:
      context: ..
      dockerfile: Containerfile
    image: hail:local
    depends_on:
      stalwart-init:
        condition: service_completed_successfully
    command: ["/usr/local/bin/hail-api"]
    environment:
      - HAIL_DATABASE_URL=sqlite:///var/lib/hail/hail.db
      - HAIL_STALWART__JMAP_URL=http://stalwart:8080
      - HAIL_STALWART__MANAGEMENT_URL=http://stalwart:8080
      - HAIL_SERVER__BIND=0.0.0.0:8080
      # Intentional difference from docker-compose.yml: local smoke default is loopback HTTP.
      - HAIL_SERVER__PUBLIC_URL=${HAIL_PUBLIC_URL:-http://127.0.0.1:8080}
      - HAIL_SECRETS__SERVER_KEY=${HAIL_SERVER_KEY:?set HAIL_SERVER_KEY in .env}
      - HAIL_SETUP__BOOTSTRAP_ENABLED=${HAIL_SETUP_BOOTSTRAP_ENABLED:-true}
      - HAIL_SETUP__BOOTSTRAP_TOKEN=${HAIL_SETUP_BOOTSTRAP_TOKEN:?set HAIL_SETUP_BOOTSTRAP_TOKEN in .env}
      - HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_ID=${HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_ID:-}
      - HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_SECRET=${HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_SECRET:-}
      - HAIL_PROVIDER_IMPORT__GMAIL__INITIAL_IMPORT_MAX_MESSAGES=${HAIL_PROVIDER_IMPORT__GMAIL__INITIAL_IMPORT_MAX_MESSAGES:-}
      - HAIL_MAIL__CACHE__BLOB_ROOT=${HAIL_BLOB_ROOT:-/var/lib/hail/blobs}
    ports:
      - "8080:8080"
    volumes:
      - hail-data:/var/lib/hail
      - hail-blobs:/var/lib/hail/blobs
      - ./hail.example.toml:/etc/hail/hail.toml:ro
    restart: unless-stopped

  hail-worker:
    image: hail:local
    depends_on:
      stalwart-init:
        condition: service_completed_successfully
      hail-api:
        condition: service_started
    command: ["/usr/local/bin/hail-worker"]
    environment:
      - HAIL_DATABASE_URL=sqlite:///var/lib/hail/hail.db
      - HAIL_STALWART__JMAP_URL=http://stalwart:8080
      - HAIL_STALWART__MANAGEMENT_URL=http://stalwart:8080
      - HAIL_SERVER__BIND=0.0.0.0:8080
      # Intentional difference from docker-compose.yml: local smoke default is loopback HTTP.
      - HAIL_SERVER__PUBLIC_URL=${HAIL_PUBLIC_URL:-http://127.0.0.1:8080}
      - HAIL_SECRETS__SERVER_KEY=${HAIL_SERVER_KEY:?set HAIL_SERVER_KEY in .env}
      - HAIL_SETUP__BOOTSTRAP_ENABLED=${HAIL_SETUP_BOOTSTRAP_ENABLED:-true}
      - HAIL_SETUP__BOOTSTRAP_TOKEN=${HAIL_SETUP_BOOTSTRAP_TOKEN:?set HAIL_SETUP_BOOTSTRAP_TOKEN in .env}
      - HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_ID=${HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_ID:-}
      - HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_SECRET=${HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_SECRET:-}
      - HAIL_PROVIDER_IMPORT__GMAIL__INITIAL_IMPORT_MAX_MESSAGES=${HAIL_PROVIDER_IMPORT__GMAIL__INITIAL_IMPORT_MAX_MESSAGES:-}
      - HAIL_MAIL__CACHE__BLOB_ROOT=${HAIL_BLOB_ROOT:-/var/lib/hail/blobs}
    volumes:
      - hail-data:/var/lib/hail
      - hail-blobs:/var/lib/hail/blobs
    restart: unless-stopped

volumes:
  stalwart-data: {}
  hail-data: {}
  hail-blobs: {}
