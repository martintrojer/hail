# Litestream backup overlay for hail.db.
#
# This file is optional and OFF by default. Apply it after the shared base and
# chosen mail-backend flavour when you want continuous SQLite replication for
# hail.db:
#
#   cp deploy/litestream.example.yml deploy/litestream.yml
#   podman compose -f deploy/docker-compose.yml -f deploy/docker-compose.selfhost.yml -f deploy/docker-compose.litestream.yml up -d
#   docker compose  -f deploy/docker-compose.yml -f deploy/docker-compose.selfhost.yml -f deploy/docker-compose.litestream.yml up -d
#
# For Gmail flavour, replace docker-compose.selfhost.yml with
# docker-compose.gmail.yml.
#
# The example config writes to ./backups/litestream by default and does not
# require cloud credentials. Edit deploy/litestream.yml for S3 or R2 before
# using it for production backups.

services:
  litestream:
    # Pin Litestream 0.3.x because deploy/litestream.example.yml uses the
    # stable v0.3 config format with a replicas array. Operators should update
    # both image and config together after testing a Litestream upgrade.
    image: docker.io/litestream/litestream:0.3.13
    command: ["replicate", "-config", "/etc/litestream.yml"]
    depends_on:
      hail-api:
        condition: service_started
    environment:
      - AWS_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${LITESTREAM_REGION:-us-east-1}
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET:-}
      - LITESTREAM_PATH=${LITESTREAM_PATH:-hail.db}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT:-}
    volumes:
      - hail-data:/var/lib/hail
      - ./litestream.yml:/etc/litestream.yml:ro
      # Used by the local-file example. For S3/R2 this mount is harmless.
      - ${LITESTREAM_LOCAL_BACKUP_PATH:-./backups/litestream}:/backup
    restart: unless-stopped
