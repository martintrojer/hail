# hail — operator configuration (example).
#
# This file is read by both `hail-api` and `hail-worker` on startup via the
# unified `hail_core::Config::load()` loader (see crates/hail-core/src/config.rs).
#
# Discovery order:
#   1. `$HAIL_CONFIG` if set and the file exists
#   2. /etc/hail/hail.toml  (the canonical container path)
#   3. ./hail.toml          (dev fallback)
#
# Every field below can be overridden by an environment variable prefixed
# with `HAIL_`. Nested fields use a DOUBLE UNDERSCORE as separator:
#
#   database_url            ->  HAIL_DATABASE_URL
#   stalwart.jmap_url       ->  HAIL_STALWART__JMAP_URL
#   server.bind             ->  HAIL_SERVER__BIND
#   secrets.server_key      ->  HAIL_SECRETS__SERVER_KEY   (preferred in prod)
#
# Env wins over TOML, so secrets can live outside the config file.

# --- Sidecar database -------------------------------------------------------
# sqlx URL for the SQLite sidecar. WAL mode + the rest of hail's pragmas are
# applied in code (see `hail_db::connect`). For Docker Compose, point this at
# the mounted volume.
database_url = "sqlite:///var/lib/hail/hail.db"

# --- Stalwart endpoints -----------------------------------------------------
[stalwart]
# JMAP HTTP endpoint. In Compose this is the service name + JMAP port.
jmap_url = "http://stalwart:8080"
# Stalwart JMAP management endpoint. Optional, but enable it for /setup and
# /admin provisioning to create/list/delete domains and users in Stalwart
# without editing config files or restarting Stalwart. In the shipped Compose
# stack this is the same internal HTTP listener as JMAP; hail posts
# urn:stalwart:jmap method calls to /jmap/ and does not use legacy REST
# management paths.
management_url = "http://stalwart:8080"

# --- HTTP server (hail-api) -------------------------------------------------
# hail-worker parses this section too (so a single TOML serves both bins) but
# only `bind` and `public_url` are actually used by the API.
[server]
bind = "0.0.0.0:8080"
public_url = "https://hail.example.com"
# Directory containing the built SPA bundle. If unset, hail-api checks
# HAIL_WEBAPP_DIR, then defaults to /srv/hail/webapp.
# webapp_dir = "/srv/hail/webapp"

# --- Provider import / Gmail OAuth (OPTIONAL) -------------------------------
# Required only for Gmail provider import mode. Prefer env vars for the secret:
#   export HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_ID="...apps.googleusercontent.com"
#   export HAIL_PROVIDER_IMPORT__GMAIL__OAUTH_CLIENT_SECRET="..."
#
# [provider_import.gmail]
# oauth_client_id = "REPLACE_ME.apps.googleusercontent.com"
# oauth_client_secret = "REPLACE_ME"
# oauth_auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
# oauth_token_url = "https://oauth2.googleapis.com/token"
# oauth_revoke_url = "https://oauth2.googleapis.com/revoke"
# api_base_url = "https://gmail.googleapis.com"
# Optional smoke/dev bound for the initial historical import. Leave unset for
# production/full import. When set, the worker imports at most this many Gmail
# messages per initial import run, records an explicit audit event, and keeps the
# account in initial_sync with a durable cursor for a later continuation.
# initial_import_max_messages = 200

# --- Admin (OPTIONAL) -------------------------------------------------------
# Uncomment AND set to disable the first-run wizard at /setup. Leave commented
# to enable the wizard.
#
# Stalwart remains the source of truth for passwords and account creation. Hail
# does not use an admin password/hash from this file and does not seed a fake
# local user at startup. Instead, when this email successfully logs in through
# Stalwart/JMAP, hail upserts the local users row with Stalwart's real
# jmap_account_id and marks it is_admin=1. This makes the config-file path
# converge with the wizard path without storing duplicate password state.
#
# [admin]
# email = "you@example.com"
# display_name = "Operator"

# --- Setup bootstrap (REQUIRED FOR FIRST-RUN WIZARD) ------------------------
# The setup state endpoint intentionally stays generic for empty deployments,
# but POST /api/setup/admin is disabled unless this section/env is set. Generate
# a temporary operator-only token and paste it into the /setup form:
#
#   export HAIL_SETUP__BOOTSTRAP_ENABLED=true
#   export HAIL_SETUP__BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
#
# Leave disabled if you use the [admin] config-file path instead of the wizard.
# Prefer env vars over TOML for the token in production.
#
# [setup]
# bootstrap_enabled = true
# bootstrap_token = "REPLACE_ME_WITH_OPERATOR_BOOTSTRAP_TOKEN"

# --- Secrets ----------------------------------------------------------------
# AES-GCM key used to wrap JMAP tokens at rest (DD-8). Prefer 64 hex
# characters from `openssl rand -hex 32`; non-hex raw strings of at least
# 32 bytes are also accepted.
#
# RECOMMENDED: leave this commented out in TOML and set the env var instead,
# so the key isn't checked into the same file the rest of the deployment lives in:
#   export HAIL_SECRETS__SERVER_KEY="$(openssl rand -hex 32)"
#
[secrets]
# server_key = "REPLACE_ME_WITH_64_HEX_CHARS"  # set via HAIL_SECRETS__SERVER_KEY in prod
