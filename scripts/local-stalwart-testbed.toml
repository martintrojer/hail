[server]
hostname = "mail.hail.test"

[server.listener."http"]
bind = ["0.0.0.0:8080"]
protocol = "http"

[server.listener."smtp"]
bind = ["0.0.0.0:25"]
protocol = "smtp"

[storage]
data = "sqlite"
fts = "sqlite"
lookup = "sqlite"
blob = "filesystem"
directory = "internal"

[store."sqlite"]
type = "sqlite"
path = "/var/lib/stalwart/stalwart.sqlite3"

[store."sqlite".pool]
max-connections = 10
workers = 10

[store."filesystem"]
type = "fs"
path = "/var/lib/stalwart/blobs"
depth = 2

# Local smoke profile: provider import uses JMAP Blob/upload before
# Email/import, so Stalwart's default 1000 files / 50 MB upload-window quota can
# stop live Gmail smoke runs after only a few hundred messages. This raises the
# per-window JMAP upload quota for throwaway local testbeds only. Keep
# production quotas deliberate; see docs/provider-import-architecture.md.
[jmap.protocol.upload]
max-size = 50000000
max-concurrent = 4
ttl = "1h"

[jmap.protocol.upload.quota]
files = 10000
size = 1073741824

[directory."internal"]
type = "internal"
store = "sqlite"

# Bootstrap/admin only. This local testbed does not yet automate domain/user
# provisioning; see docs/testing.md for the explicit manual runbook.
[authentication.fallback-admin]
user = "admin"
secret = "CHANGE_ME_WITH_OUTPUT_OF_STALWART_PWHASH"

[tracer."stdout"]
type = "stdout"
level = "info"
ansi = false
enable = true
